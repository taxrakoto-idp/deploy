apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "php-app.fullname" . }}
  labels:
    {{- include "php-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "php-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "php-app.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: fetch-source
          image: {{ printf "%s:%s" .Values.source.gitImage.repository (.Values.source.gitImage.tag | toString) | quote }}
          imagePullPolicy: {{ .Values.source.gitImage.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              rm -rf /workspace/* /workspace/.[!.]* /workspace/..?* 2>/dev/null || true
              if [ -n "${GIT_USERNAME:-}" ]; then
                cat > /tmp/git-askpass.sh <<'EOF'
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s\n' "$GIT_USERNAME" ;;
                *) printf '%s\n' "$GIT_TOKEN" ;;
              esac
              EOF
                chmod 0700 /tmp/git-askpass.sh
                export GIT_ASKPASS=/tmp/git-askpass.sh
                export GIT_TERMINAL_PROMPT=0
              fi
              
              git config --global --add safe.directory /workspace
              git init /workspace
              git -C /workspace remote add origin "$GIT_REPOSITORY"
              git -C /workspace fetch --depth="$GIT_DEPTH" origin "$GIT_REVISION"
              git -C /workspace checkout --detach FETCH_HEAD
              rm -rf /workspace/.git
          env:
            - name: HOME
              value: /tmp
            - name: GIT_REPOSITORY
              value: {{ required "source.repository is required" .Values.source.repository | quote }}
            - name: GIT_REVISION
              value: {{ .Values.source.revision | quote }}
            - name: GIT_DEPTH
              value: {{ .Values.source.depth | quote }}
            {{- with .Values.source.credentials.existingSecret }}
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.source.credentials.usernameKey | quote }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.source.credentials.tokenKey | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: source
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      containers:
        - name: php
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | toString) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.env }}
          envFrom:
            - configMapRef:
                name: {{ include "php-app.fullname" . }}-env
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path | quote }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: source
              mountPath: {{ .Values.source.mountPath | quote }}
              readOnly: {{ .Values.source.readOnly }}
      volumes:
        - name: source
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

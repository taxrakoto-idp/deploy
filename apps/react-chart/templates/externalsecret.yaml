{{- $secretEnv := .Values.secretEnv -}}
{{- if and $secretEnv $secretEnv.data }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-secret" .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ required "secretEnv.secretStoreRef.name is required" $secretEnv.secretStoreRef.name }}
    kind: {{ default "SecretStore" $secretEnv.secretStoreRef.kind }}
  target:
    name: {{ printf "%s-secret" .Release.Name }}
    creationPolicy: Owner
  data:
    {{- range $secretEnv.data }}
    {{- $remote := required "secretEnv.data[].remoteRef is required" .remoteRef }}
    - secretKey: {{ required "secretEnv.data[].name is required" .name }}
      remoteRef:
        key: {{ required "secretEnv.data[].remoteRef.key is required" $remote.key }}
        {{- if $remote.property }}
        property: {{ $remote.property }}
        {{- end }}
    {{- end }}
{{- end }}

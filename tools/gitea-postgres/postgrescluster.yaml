apiVersion: postgres-operator.crunchydata.com/v1
kind: PostgresCluster
metadata:
  name: gitea-postgres
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-postgres
    app.kubernetes.io/part-of: taxrakoto-idp
    app.kubernetes.io/component: postgres
spec:
  postgresVersion: 17

  instances:
    - name: instance1
      replicas: 1
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-csi
        resources:
          requests:
            storage: 2Gi

  users:
    - name: gitea
      databases:
        - gitea

  # Backups are disabled for the local demonstration to avoid allocating an
  # additional pgBackRest repository PVC. Uncomment this block when backups
  # are required.
  # backups:
  #   pgbackrest:
  #     global:
  #       repo1-retention-full: "2"
  #     repos:
  #       - name: repo1
  #         schedules:
  #           full: "0 2 * * 0"
  #           differential: "0 2 * * 1-6"
  #         volume:
  #           volumeClaimSpec:
  #             accessModes:
  #               - ReadWriteOnce
  #             storageClassName: nfs-csi
  #             resources:
  #               requests:
  #                 storage: 2Gi

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-admin-secret-initializer
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-admin-secret-initializer
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - gitea-admin-secret
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-admin-secret-initializer
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-admin-secret-initializer
subjects:
  - kind: ServiceAccount
    name: gitea-admin-secret-initializer
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-admin-secret-initializer
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-admin-secret-initializer
        app.kubernetes.io/part-of: taxrakoto-idp
    spec:
      serviceAccountName: gitea-admin-secret-initializer
      restartPolicy: OnFailure
      containers:
        - name: create-secret
          image: docker.io/curlimages/curl:8.21.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
              ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              namespace_file=/var/run/secrets/kubernetes.io/serviceaccount/namespace
              namespace="$(cat "${namespace_file}")"
              api="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
              secret_url="${api}/api/v1/namespaces/${namespace}/secrets/gitea-admin-secret"
              authorization="Authorization: Bearer $(cat "${token_file}")"

              if curl --fail --silent \
                --cacert "${ca_file}" \
                --header="${authorization}" \
                --output /dev/null \
                "${secret_url}"; then
                echo "gitea-admin-secret already exists"
                exit 0
              fi

              username_base64="$(printf '%s' 'gitea_admin' | base64 | tr -d '\n')"
              password_base64="$(dd if=/dev/urandom bs=48 count=1 2>/dev/null | base64 | tr -d '\n')"

              cat > /tmp/gitea-admin-secret.json <<EOF
              {
                "apiVersion": "v1",
                "kind": "Secret",
                "metadata": {
                  "name": "gitea-admin-secret",
                  "namespace": "${namespace}",
                  "labels": {
                    "app.kubernetes.io/name": "gitea-admin-secret",
                    "app.kubernetes.io/part-of": "taxrakoto-idp"
                  }
                },
                "type": "Opaque",
                "data": {
                  "username": "${username_base64}",
                  "password": "${password_base64}"
                }
              }
              EOF

              secrets_url="${api}/api/v1/namespaces/${namespace}/secrets"
              curl --fail --silent --show-error \
                --cacert "${ca_file}" \
                --header="${authorization}" \
                --header="Content-Type: application/json" \
                --request POST \
                --data-binary @/tmp/gitea-admin-secret.json \
                --output /dev/null \
                "${secrets_url}"
              echo "gitea-admin-secret created"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
